```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Service Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let token = localStorage.getItem('jwtToken') || '';

            const apiBase = 'http://localhost:3000';

            // DOM Elements
            const registerForm = document.getElementById('registerForm');
            const loginForm = document.getElementById('loginForm');
            const generateKeyForm = document.getElementById('generateKeyForm');
            const signForm = document.getElementById('signForm');
            const forgetForm = document.getElementById('forgetForm');
            const qrCodeDiv = document.getElementById('qrcode');
            const responseDiv = document.getElementById('response');
            const logoutBtn = document.getElementById('logoutBtn');

            // Handle Register
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('regUsername').value;
                const password = document.getElementById('regPassword').value;

                const response = await fetch(`${apiBase}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await response.json();
                responseDiv.textContent = JSON.stringify(data, null, 2);

                if (data.totp_url) {
                    qrCodeDiv.innerHTML = '';
                    new QRCode(qrCodeDiv, {
                        text: data.totp_url,
                        width: 128,
                        height: 128,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                    });
                }
            });

            // Handle Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('loginUsername').value;
                const password = document.getElementById('loginPassword').value;

                const response = await fetch(`${apiBase}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await response.json();
                responseDiv.textContent = JSON.stringify(data, null, 2);

                if (data.token) {
                    token = data.token;
                    localStorage.setItem('jwtToken', token);
                    updateUI();
                }
            });

            // Handle Generate Key
            generateKeyForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const totpCode = document.getElementById('generateTotp').value;

                const response = await fetch(`${apiBase}/api/generate_key`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ totp_code: totpCode }),
                });
                const data = await response.json();
                responseDiv.textContent = JSON.stringify(data, null, 2);
            });

            // Handle Sign
            signForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const message = document.getElementById('signMessage').value;
                const totpCode = document.getElementById('signTotp').value;

                const response = await fetch(`${apiBase}/api/sign`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ message, totp_code: totpCode }),
                });
                const data = await response.json();
                responseDiv.textContent = JSON.stringify(data, null, 2);
            });

            // Handle Forget
            forgetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const totpCode = document.getElementById('forgetTotp').value;

                const response = await fetch(`${apiBase}/api/forget`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ totp_code: totpCode }),
                });
                responseDiv.textContent = `Status: ${response.status}`;
                if (response.status === 200) {
                    localStorage.removeItem('jwtToken');
                    token = '';
                    updateUI();
                }
            });

            // Handle Logout
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('jwtToken');
                token = '';
                updateUI();
                responseDiv.textContent = 'Logged out';
            });

            // Update UI based on login state
            function updateUI() {
                const isLoggedIn = !!token;
                generateKeyForm.style.display = isLoggedIn ? 'block' : 'none';
                signForm.style.display = isLoggedIn ? 'block' : 'none';
                forgetForm.style.display = isLoggedIn ? 'block' : 'none';
                logoutBtn.style.display = isLoggedIn ? 'block' : 'none';
                if (!isLoggedIn) {
                    registerForm.style.display = 'block';
                    loginForm.style.display = 'block';
                }
            }

            // Initial UI setup
            updateUI();
        });
    </script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-4 text-center">Wallet Service Auth</h1>

    <!-- Register Form -->
    <form id="registerForm" class="mb-4">
        <h2 class="text-xl font-semibold mb-2">Register</h2>
        <input type="text" id="regUsername" placeholder="Username" class="w-full p-2 mb-2 border rounded">
        <input type="password" id="regPassword" placeholder="Password" class="w-full p-2 mb-2 border rounded">
        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded">Register</button>
    </form>

    <!-- Login Form -->
    <form id="loginForm" class="mb-4">
        <h2 class="text-xl font-semibold mb-2">Login</h2>
        <input type="text" id="loginUsername" placeholder="Username" class="w-full p-2 mb-2 border rounded">
        <input type="password" id="loginPassword" placeholder="Password" class="w-full p-2 mb-2 border rounded">
        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded">Login</button>
    </form>

    <!-- Generate Key Form -->
    <form id="generateKeyForm" class="mb-4" style="display: none;">
        <h2 class="text-xl font-semibold mb-2">Generate Key</h2>
        <input type="text" id="generateTotp" placeholder="TOTP Code" class="w-full p-2 mb-2 border rounded">
        <button type="submit" class="w-full bg-green-500 text-white p-2 rounded">Generate</button>
    </form>

    <!-- Sign Form -->
    <form id="signForm" class="mb-4" style="display: none;">
        <h2 class="text-xl font-semibold mb-2">Sign Message</h2>
        <input type="text" id="signMessage" placeholder="Message" class="w-full p-2 mb-2 border rounded">
        <input type="text" id="signTotp" placeholder="TOTP Code" class="w-full p-2 mb-2 border rounded">
        <button type="submit" class="w-full bg-green-500 text-white p-2 rounded">Sign</button>
    </form>

    <!-- Forget Form -->
    <form id="forgetForm" class="mb-4" style="display: none;">
        <h2 class="text-xl font-semibold mb-2">Forget TOTP</h2>
        <input type="text" id="forgetTotp" placeholder="TOTP Code" class="w-full p-2 mb-2 border rounded">
        <button type="submit" class="w-full bg-red-500 text-white p-2 rounded">Forget</button>
    </form>

    <!-- Logout Button -->
    <button id="logoutBtn" class="w-full bg-gray-500 text-white p-2 rounded" style="display: none;">Logout</button>

    <!-- QR Code and Response -->
    <div id="qrcode" class="mt-4 text-center"></div>
    <pre id="response" class="mt-4 p-2 bg-gray-200 rounded"></pre>
</div>
</body>
</html>
