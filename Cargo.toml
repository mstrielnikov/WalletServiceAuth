[package]
name = "WalletServiceAuth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
tokio = { version = "1.47.1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "sqlite"] }
chrono = "0.4.42"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
hex = "0.4.3"
base64 = "0.22.1"
jsonwebtoken = "9.3.1"
argon2 = "0.5.3"
secp256k1 = { version = "0.29.0", features = ["rand-std", "recovery"] }
aes-gcm = "0.10.3"
scrypt = "0.11.0"
rand = "0.8.5"
sha3 = "0.10.8"
totp-rs = "5.7"
