[package]
name = "WalletServiceAuth"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wallet-service"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }
tokio = { version = "1.47.1", features = ["full"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres"] }
chrono = "0.4.42"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.132"
hex = "0.4.3"
jsonwebtoken = "9.3.1"
argon2 = "0.5.3"
secp256k1 = { version = "0.29.0", features = ["rand-std"] }
aes-gcm = "0.10.3"
rand = "0.8.5"
sha3 = "0.10.8"
totp-rs = "5.7.0"
log = "0.4.28"
env_logger = "0.11.8"
base32 = "0.4"

[dev-dependencies]
reqwest = { version = "0.12.8", features = ["json", "blocking"] }
